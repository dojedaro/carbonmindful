[project]
name = "carbonmindful"
version = "1.0.0"
description = "Scenario-based carbon footprint calculation for AI model training"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C90", "PL", "N"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "E402", "E501", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["carbonmindful", "measure", "app.py"]

[[tool.mypy.overrides]]
module = ["altair.*", "streamlit.*", "codecarbon.*", "torchvision.*", "pynvml.*"]
ignore_missing_imports = true
